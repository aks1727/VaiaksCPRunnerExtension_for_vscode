<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39c12" />
      <stop offset="100%" stop-color="#d35400" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecf0f1" />
      <stop offset="100%" stop-color="#bdc3c7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3a7bd5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Circuit Traces Bottom -->
  <path d="M 80 410 L 160 410 L 180 390 L 220 390" stroke="#1f293d" stroke-width="3" fill="none" />
  <circle cx="80" cy="410" r="4" fill="#00d2ff" />
  <path d="M 432 410 L 352 410 L 332 390 L 292 390" stroke="#1f293d" stroke-width="3" fill="none" />
  <circle cx="432" cy="410" r="4" fill="#00d2ff" />

  <!-- Code Brackets & Lightning Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Left Bracket < (Bronze) -->
    <path d="M 170 155 L 105 220 L 170 285" fill="none" stroke="url(#bronzeGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Bracket > (Silver) -->
    <path d="M 342 155 L 407 220 L 342 285" fill="none" stroke="url(#silverGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Central Lightning Bolt ⚡ -->
    <polygon points="280,75 200,225 265,225 230,375 330,195 260,195" fill="url(#silverGrad)" />
    
    <!-- Play Icon Triangle inside Bolt -->
    <polygon points="248,205 272,220 248,235" fill="#0b0e14" />
  </g>

  <!-- Typography: VCP -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="75" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4" filter="url(#shadow)">VCP</text>

  <!-- Typography: Runner -->
  <text x="256" y="425" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="32" fill="#00d2ff" text-anchor="middle" letter-spacing="8">RUNNER</text>
</svg>
